# Deploy: ship one commit's images to production on the host, over SSH, to the
# forced command that runs ops/deploy.sh (.scratch/ci-cd-github-actions,
# ticket 07).
#
# Started only by hand: Actions > Deploy > Run workflow, on main, with an
# optional commit SHA (empty means main's head). The repo is on GitHub Free,
# with no Environment approvals and no branch protection, so dispatching is
# the owner's approval, and this job checks everything itself before it
# touches the host (ci/deploy-gate.sh):
#   - the SHA is a full commit on main;
#   - CI passed on it (test, build, migrations, ratchet);
#   - cd.yml pushed its app and migrate images to GHCR, and their provenance
#     says so (this commit, this repository, the right Dockerfile target, a
#     cd.yml run on main).
# The digests the host deploys come from GHCR, checked against those images'
# bytes, not from anything typed into the form.
#
# It lives apart from cd.yml because cd.yml builds on every CI pass and every
# PR: sharing that workflow's concurrency group would let a new build push a
# pending deploy out of the queue, and its manual dispatch means "rebuild".
#
# Redeploy or roll back: dispatch with the full SHA of the release to go back
# to. It must still pass the gate, and GHCR keeps every pushed :<sha> (the host
# keeps only the last 3 pulled). Migrations are forward-only: going back past
# a migration leaves the newer schema in place, which older code may not
# handle; the pre-deploy dump in the host's backups/ is the way back for data,
# and restoring it is a human step. The host's logs/deploy.log has the whole
# story of every run.
#
# What this does not ship: ops/deploy.sh and docker-compose.prod.yml on the
# host are copies the owner puts there (ticket 08). The deploy key can run
# only ops/deploy.sh with a SHA and two digests, and letting it write files
# would let a leaked key replace the script. So when a release changes either
# file, copy the new one to the host BEFORE dispatching this workflow.
#
# Secrets (repository-level, Settings > Secrets and variables > Actions):
#   DEPLOY_HOST         the host's name or IP; the SSH user is always `deploy`
#   DEPLOY_SSH_KEY      the private key whose public half is the forced-command
#                       key in ~deploy/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  the host's key line(s), from `ssh-keyscan <host>`
#                       checked against the host's own fingerprints
name: Deploy
run-name: ${{ format('Deploy {0}', inputs.sha || 'main') }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-hex commit SHA on main to deploy (empty for main's head). To roll back, give an older one.
        required: false
        default: ""
        type: string

# One deploy at a time, and a running one is never cancelled (ops/deploy.sh
# also takes a lock on the host). GitHub keeps at most one run waiting behind
# it: dispatching again while one waits replaces the waiting one.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out ci/deploy-gate.sh
      actions: read # CI's result and the image's build run
      packages: read # the images and their provenance in GHCR
    steps:
      # Against mistakes, not a control: anyone who can dispatch can also push
      # a branch with an edited copy of this file, and on the Free plan
      # repository secrets reach every branch. Write access is the boundary.
      - name: Refuse anything but main's copy of this workflow
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run Deploy from main (this run is on $GITHUB_REF); pick the commit with the sha input."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate, green CI and cd.yml's images for the commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_INPUT: ${{ inputs.sha }}
        run: ci/deploy-gate.sh "$SHA_INPUT"

      - name: Say why the gate refused
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          {
            echo "### Deploy refused before reaching the host"
            echo
            echo "The gate's error above says why. Nothing was sent to the host; production is unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SSH key and the pinned host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if ! [[ $DEPLOY_HOST =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "::error::DEPLOY_HOST must be a bare host name or IPv4 address"
            exit 1
          fi
          dir="$RUNNER_TEMP/ssh"
          (umask 077 && mkdir -p "$dir" && printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key" &&
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts")
          if ! ssh-keygen -F "$DEPLOY_HOST" -f "$dir/known_hosts" > /dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no key for DEPLOY_HOST"
            exit 1
          fi

      - name: Deploy on the host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ steps.gate.outputs.sha }}
          APP_DIGEST: ${{ steps.gate.outputs.app-digest }}
          MIGRATE_DIGEST: ${{ steps.gate.outputs.migrate-digest }}
          CI_RUN: ${{ steps.gate.outputs.ci-run }}
          BUILD_RUN: ${{ steps.gate.outputs.build-run }}
        run: |
          dir="$RUNNER_TEMP/ssh"
          # The forced command ignores the command line and hands these three
          # words to ops/deploy.sh as SSH_ORIGINAL_COMMAND. ssh exits with the
          # script's code, or 255 when ssh itself failed.
          rc=0
          ssh -i "$dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -T -- "deploy@$DEPLOY_HOST" "$SHA $APP_DIGEST $MIGRATE_DIGEST" || rc=$?

          case "$rc" in
            0) result="Deployed. Production runs this release and answers /api/health." ;;
            1) result="A step failed; nothing is known to be broken. The host's logs/deploy.log says which step, and whether the app had been switched (before the switch the old app still runs)." ;;
            2) result="The host refused the arguments as malformed; nothing ran. Check that ops/deploy.sh on the host matches this repo." ;;
            3) result="The new app never answered /api/health, so the host rolled back to the release before it, which is healthy. The migrations stay applied." ;;
            4) result="The new app never answered /api/health and there was no healthy release to go back to. Production needs a human now: see logs/deploy.log and backups/ on the host." ;;
            255) result="SSH failed (connection, host key or deploy key). If it dropped mid-run the deploy may still be running on the host: check its logs/deploy.log before retrying." ;;
            *) result="Unexpected exit code; see the log above and the host's logs/deploy.log." ;;
          esac
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs"
          {
            echo "### Deploy of \`$SHA\`: exit $rc"
            echo
            echo "$result"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | [\`$SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA) |"
            echo "| app | \`$APP_DIGEST\` |"
            echo "| migrate | \`$MIGRATE_DIGEST\` |"
            echo "| CI run | [$CI_RUN]($url/$CI_RUN) |"
            echo "| image build | [$BUILD_RUN]($url/$BUILD_RUN) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ]; then
            echo "::error::ops/deploy.sh exited $rc: $result"
          fi
          exit "$rc"

      - name: Remove the SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
