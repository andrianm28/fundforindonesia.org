# CD: build the production image in Actions and push it to GHCR, so the shared
# host never builds (.scratch/ci-cd-github-actions, ticket 05). Deploying is a
# separate, dispatch-only workflow, deploy.yml (ticket 07), which reads these
# images' digests and provenance back from GHCR.
#
# Triggers:
# - workflow_run: after CI passes on main. Builds exactly the commit CI tested
#   (workflow_run.head_sha, not whatever main points at by now) and pushes it.
# - workflow_dispatch: a manual rebuild. Pushes only when run on main.
# - pull_request: proves the image on every PR without pushing anything:
#   builds both targets, runs the migrations and a health check from the built
#   images, and scans them. workflow_run only ever fires from the default
#   branch's copy of this file, so without this a broken Dockerfile or
#   workflow would first show up after merge. Jobs added here later that must
#   not run on PRs need their own `if`. On a PR the `image` job is skipped
#   (still reporting as skipped, never missing) unless the image can change;
#   see the `scope` job and ticket 17.
#
# Build args: NEXT_PUBLIC_* and the site URLs are inlined by `next build`, so
# they are fixed per image. They come from repository-level Actions variables
# (Settings > Secrets and variables > Actions > Variables), not from the
# `production` Environment: a job that names an Environment waits for that
# Environment's required reviewers, which would put an approval in front of
# every image build and block PR builds entirely. They are public values, so
# variables, never secrets. Unset, each falls back to its production value:
#   NEXT_PUBLIC_BASE_URL           default https://fundforindonesia.org, the
#                                  canonical public domain (src/lib/public-url.ts)
#   NEXTAUTH_URL                   default https://galang.fundforindonesia.org
#   NEXT_PUBLIC_DONATIONS_ENABLED  default false
#   NEXT_PUBLIC_VOLUNTEER_ENABLED  default false (Volunteer Trip Registration)
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  # PR runs are superseded by newer pushes. On main a running build is never
  # cancelled half-way; GitHub keeps at most one pending run behind it and
  # drops older pending ones, which is fine because only the newest commit
  # matters (and the gate step keeps :latest from moving backwards).
  group: cd-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/andrianm28/fundforindonesia.org
  # The commit CI tested on workflow_run; the triggering commit otherwise.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  PUSH: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  # Decides whether `image` has anything to prove. The skip is a job-level
  # `if` on `image`, never a `paths:` filter on the workflow: a workflow that
  # does not trigger reports no check at all, while a job skipped by `if`
  # still reports `image` as skipped, which GitHub counts as passing. So no
  # PR is ever left waiting on a check that will not come (ticket 17).
  #
  # Anything but a pull_request (push to main via workflow_run, dispatch)
  # always builds: deploy.yml needs these images in GHCR for every main
  # commit. On a PR the files it changes decide. If the file list cannot be
  # read, this fails open and the image builds.
  scope:
    name: image scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the PR's changed files
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - name: Decide whether the image can change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Paths that change what the Dockerfile builds or what is scanned:
          # the Dockerfile and its context rules, dependencies, prisma/ and
          # prisma.config.ts (the migrate image), next.config.mjs, the Trivy
          # ignore list, the workflows (this file included), and the files
          # `COPY . .` pulls into the build: public/ (its file permissions
          # once caused EACCES in production), tsconfig.json,
          # postcss.config.mjs (Tailwind 4 keeps its tokens in src/styles/globals.css,
          # so no tailwind.config.* exists now; the pattern still lists it in
          # case one returns). src/ is deliberately
          # left out: a PR touching only src/ skips the image build, which the
          # `build` job in ci.yml and the image build on every push to main
          # still cover.
          pattern='^(Dockerfile|\.dockerignore|package\.json|package-lock\.json|prisma\.config\.ts|next\.config\.mjs|tsconfig\.json|postcss\.config\.mjs|tailwind\.config\.[^/]+|\.trivyignore|prisma/|public/|\.github/workflows/)'
          if [ "$EVENT" != pull_request ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT: always builds the image"
            exit 0
          fi
          if ! files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::warning::could not list the PR's files; building the image to be safe"
            exit 0
          fi
          matched="$(printf '%s\n' "$files" | grep -E "$pattern" || true)"
          if [ -n "$matched" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "image-relevant files changed:"; echo "$matched"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no image-relevant file changed; skipping the image job"
          fi

  image:
    name: image
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A workflow_run fires for every completed CI run on a branch named main,
    # including failed runs and a fork's PR from its own "main". Only a green
    # push to this repository's main may publish.
    # `needs.scope.outputs.build` is false only for a docs-or-app-code-only PR.
    if: >-
      needs.scope.outputs.build == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
      actions: read # the gate step checks CI's result for a dispatched commit
      packages: write # push to GHCR
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    outputs:
      sha: ${{ env.SHA }}
      app-digest: ${{ steps.push-app.outputs.digest }}
      migrate-digest: ${{ steps.push-migrate.outputs.digest }}
      app-staging-digest: ${{ steps.push-app-staging.outputs.digest }}
    services:
      # A throwaway database, only for the smoke run of the built images.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMOKE_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      # The runner's free disk does not hold the app image twice over (buildx
      # cache, the loaded image, and Trivy's export of it): the first PR run
      # died with "no space left on device" in the scan. These preinstalled
      # SDKs are unused here and free well over 10 GB.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # workflow_run is already gated on green CI by the job's `if`; a manual
      # dispatch is not, so it must find a green CI push run for the commit.
      # And since CI runs can finish out of commit order, :latest only moves
      # to the commit that is main's head right now.
      - name: Gate, publish only CI-passed commits; latest only for main's head
        id: gate
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            passed="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
              --event push --status success --json databaseId --jq length)"
            if [ "$passed" = 0 ]; then
              echo "::error::CI has not passed on $SHA; refusing to publish it"
              exit 1
            fi
          fi
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" = "$SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on to $head; pushing :$SHA without moving :latest"
          fi

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.SHA }}
            type=raw,value=latest,enable=${{ steps.gate.outputs.latest == 'true' }}
          # The default revision label is github.sha, which on workflow_run is
          # main's head rather than the tested commit. (`context: git` would
          # read the checkout, but refuses a detached HEAD.)
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      # Build both targets into the local Docker engine first, so they can be
      # smoke-run and scanned before anything is pushed: :latest never moves
      # to an image that failed either check. The push steps below repeat the
      # same builds in the same buildx builder, whose local cache still holds
      # every layer from these ones (independent of the GHA cache export), so
      # they push the layers that were tested and scanned.
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          load: true
          push: false
          provenance: false
          tags: local/app:candidate
          labels: ${{ steps.meta.outputs.labels }}
          build-args: &build-args |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://fundforindonesia.org' }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL || 'https://galang.fundforindonesia.org' }}
            NEXT_PUBLIC_DONATIONS_ENABLED=${{ vars.NEXT_PUBLIC_DONATIONS_ENABLED || 'false' }}
            NEXT_PUBLIC_VOLUNTEER_ENABLED=${{ vars.NEXT_PUBLIC_VOLUNTEER_ENABLED || 'false' }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build the migrate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          load: true
          push: false
          provenance: false
          tags: local/migrate:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      # Ticket 14 slimmed the app image from 974 to 220 MiB; keep the size visible
      # so a regression shows up in the run summary, not on the host's disk.
      - name: Report the image sizes
        run: |
          app="$(( $(docker image inspect --format '{{.Size}}' local/app:candidate) / 1048576 ))"
          migrate="$(( $(docker image inspect --format '{{.Size}}' local/migrate:candidate) / 1048576 ))"
          echo "app: $app MiB, migrate: $migrate MiB (uncompressed)"
          {
            echo "### Image sizes (uncompressed)"
            echo "| image | MiB |"
            echo "|---|---|"
            echo "| app | $app |"
            echo "| migrate | $migrate |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The image optimizer is off (next.config.mjs), so /api/health passes
      # even with sharp broken. This runs sharp itself, loaded the way Next
      # loads it, and encodes a small image so libvips is exercised too.
      - name: Smoke test, sharp loads and encodes in the app image
        run: >-
          docker run --rm local/app:candidate node -e 'require(process.env.NEXT_SHARP_PATH)({ create: { width: 8, height: 8, channels: 3, background: "#fff" } }).webp().toBuffer().then((b) => console.log("sharp ok, " + b.length + " bytes of webp"))'

      - name: Smoke test, migrate an empty database with the migrate image
        run: docker run --rm --network host -e DATABASE_URL="$SMOKE_DATABASE_URL" local/migrate:candidate

      - name: Smoke test, the app image serves /api/health against it
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e NEXTAUTH_SECRET=ci-placeholder-not-a-secret \
            -e NEXTAUTH_URL=http://localhost:3000 \
            -e ALLOW_LOCAL_AUTH_URL=1 \
            -e JOBS_SECRET=ci-placeholder-jobs-secret-not-real \
            -e FIELD_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e FIELD_ENCRYPTION_KEY_ID=enc-ci-1 \
            -e FIELD_HMAC_KEY=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE= \
            -e FIELD_HMAC_KEY_ID=hmac-ci-1 \
            -e MOCK_MIDTRANS_SERVER_KEY=ci-placeholder-not-a-secret \
            local/app:candidate
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health)" = 200 ]; then
              echo "healthy"; docker rm -f app >/dev/null; exit 0
            fi
            sleep 2
          done
          echo "::error::the app image never answered 200 on /api/health"
          docker logs app
          exit 1

      - name: Scan the app image (fail on CRITICAL, fixable vulns and secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/app:candidate
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the migrate image (fail on CRITICAL, fixable vulns and secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/migrate:candidate
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # The first scan already installed trivy and fetched its database.
          skip-setup-trivy: true

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the app image
        id: push-app
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          # Buildx's own SLSA provenance, stored with the image in GHCR. It
          # works on this private user-owned repository, unlike the GitHub
          # attestation below. It records the build args, which are public.
          # SLSA v1, pinned: deploy.yml's gate reads the v1 fields.
          provenance: mode=max,version=v1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: *build-args
          cache-from: type=gha,scope=app

      - name: Push the migrate image
        id: push-migrate
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: true
          provenance: mode=max,version=v1
          tags: ${{ env.IMAGE }}:${{ env.SHA }}-migrate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=migrate

      # The staging variant of the app image (go-live-ops 02). Same Dockerfile
      # and `runner` target; only the build args differ, because NEXT_PUBLIC_*
      # are inlined by `next build` and so cannot be changed at run time. The
      # migrate image has no build args and is shared with production. Tagged
      # <sha>-staging, a tag nothing else moves, so the production tags, the
      # production build args and deploy.yml's reading of them are unaffected.
      # Not scanned a second time: it is the same source, dependencies and base
      # as the production image scanned above; only public URL strings differ.
      #
      # Repository variables, all public, each with a default that is staging's
      # and never production's (set the variables to override):
      #   STAGING_NEXT_PUBLIC_BASE_URL           https://staging.fundforindonesia.org
      #   STAGING_NEXTAUTH_URL                   the same host
      #   STAGING_NEXT_PUBLIC_DONATIONS_ENABLED  default true (the sandbox takes the charges)
      #   STAGING_NEXT_PUBLIC_VOLUNTEER_ENABLED  default true
      # Taking charges here is safe only because the running stack sets
      # DEPLOY_ENVIRONMENT=staging, which makes the money-path guard accept the
      # Sumopod sandbox and refuse the live url (docker-compose.staging.yml).
      - name: Build the staging app image, not pushed
        if: env.PUSH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: false
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.STAGING_NEXT_PUBLIC_BASE_URL || 'https://staging.fundforindonesia.org' }}
            NEXTAUTH_URL=${{ vars.STAGING_NEXTAUTH_URL || 'https://staging.fundforindonesia.org' }}
            NEXT_PUBLIC_DONATIONS_ENABLED=${{ vars.STAGING_NEXT_PUBLIC_DONATIONS_ENABLED || 'true' }}
            NEXT_PUBLIC_VOLUNTEER_ENABLED=${{ vars.STAGING_NEXT_PUBLIC_VOLUNTEER_ENABLED || 'true' }}
          cache-from: type=gha,scope=app-staging
          cache-to: type=gha,mode=max,scope=app-staging

      - name: Push the staging app image
        id: push-app-staging
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          provenance: mode=max,version=v1
          tags: ${{ env.IMAGE }}:${{ env.SHA }}-staging
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.STAGING_NEXT_PUBLIC_BASE_URL || 'https://staging.fundforindonesia.org' }}
            NEXTAUTH_URL=${{ vars.STAGING_NEXTAUTH_URL || 'https://staging.fundforindonesia.org' }}
            NEXT_PUBLIC_DONATIONS_ENABLED=${{ vars.STAGING_NEXT_PUBLIC_DONATIONS_ENABLED || 'true' }}
            NEXT_PUBLIC_VOLUNTEER_ENABLED=${{ vars.STAGING_NEXT_PUBLIC_VOLUNTEER_ENABLED || 'true' }}
          cache-from: type=gha,scope=app-staging

      # GitHub artifact attestations need a public repository (or GitHub
      # Enterprise Cloud); on a private user-owned repository the API refuses
      # them. So they run once the repository is public, and until then the
      # buildx provenance above is the attestation.
      - name: Attest the app image
        if: env.PUSH == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push-app.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the migrate image
        if: env.PUSH == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push-migrate.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Summary
        if: env.PUSH == 'true'
        env:
          APP_DIGEST: ${{ steps.push-app.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push-migrate.outputs.digest }}
          APP_STAGING_DIGEST: ${{ steps.push-app-staging.outputs.digest }}
        run: |
          {
            echo "### Pushed ${IMAGE}"
            echo "| | tag | digest |"
            echo "|---|---|---|"
            echo "| app | \`${SHA}\`, \`latest\` | \`${APP_DIGEST}\` |"
            echo "| migrate | \`${SHA}-migrate\` | \`${MIGRATE_DIGEST}\` |"
            echo "| app (staging) | \`${SHA}-staging\` | \`${APP_STAGING_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
