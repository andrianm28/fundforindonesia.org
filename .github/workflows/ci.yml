# CI on GitHub-hosted runners, so routine verification never loads the shared
# production host (.scratch/ci-cd-github-actions, ticket 02).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every run on main completes, since it
  # gates deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The drop migration's guard is run against a real Postgres rather than
      # read as text (src/lib/drop-migration-guard.test.ts): a guard that is
      # meant to refuse has to be seen refusing. Deliberately not DATABASE_URL:
      # the unit tests must keep seeing no database at all, or src/lib/prisma.ts
      # builds a real client and every test that touches it waits for a
      # connection that is not the point.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # A "dummy" URL makes src/lib/prisma.ts use its build-time mock.
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      NEXTAUTH_SECRET: ci-placeholder-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx next build

  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # The claim migration is the one that cannot be proved against an empty
      # database, so the test that applies it to a database already holding
      # ledger rows runs here. A separate variable, so that nothing else in the
      # suite ever sees a live database.
      LEDGER_CLAIM_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply every migration to an empty Postgres
        run: npx prisma migrate deploy
      - name: The migrated database must match schema.prisma exactly
        run: |
          diff_sql="$(npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script)"
          echo "$diff_sql"
          if ! printf '%s' "$diff_sql" | grep -q "This is an empty migration"; then
            echo "::error::schema.prisma and prisma/migrations disagree; add or fix a migration."
            exit 1
          fi
      # Migrating an EMPTY database proves the DDL is valid and nothing more.
      # This step is the one that would have caught the precheck the claim
      # migration used to carry, which refused to apply to any ledger holding
      # a single posted transaction.
      - name: The claim migration, applied to a database that already holds ledger rows
        run: |
          npx prisma generate
          npx vitest run src/__tests__/ledger-transaction-claim-migration.test.ts

  ratchet:
    name: ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ratchet measures this commit's ci/baselines.json against the
          # one on the base branch, so it needs the history, not just the
          # tested commit. Without it the job fails rather than pass.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: TypeScript and lint error counts may only go down
        # The counts go against ci/baselines.json here, and that file goes
        # against ci/baselines.json on the base branch, so a pull request that
        # raises the baseline is caught instead of being measured against its
        # own raise. Raising it is allowed, never silently: add
        #
        #   env:
        #     RATCHET_ALLOW_BASELINE_BUMP: "1"
        #
        # to this step, in the same pull request as the raise, and take it
        # back out in the next one. See ci/ratchet.mjs.
        # Ticket 18 promoted four rules to error; 18 findings need a
        # non-mechanical refactor. Remove this env in the next pull request.
        env:
          RATCHET_ALLOW_BASELINE_BUMP: "1"
        run: node ci/ratchet.mjs

  e2e:
    # The flows unit tests cannot prove (ticket 11: the privileged
    # not-found view, the QRIS donation path through Receipt), driven in a
    # real browser against the production bundle. Browser-side answers that
    # need no login are stubbed at the network edge (see the specs); the
    # deploy gate only requires test, build, migrations and ratchet green,
    # so this job gates deploys through the run's overall success instead.
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXTAUTH_SECRET: ci-placeholder-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      # ADR 0012 field keys, as fixed throwaway values. The plaintext contact
      # columns are dropped, so a deployment with no keys cannot write a contact
      # detail at all: the app refuses rather than storing something it cannot
      # read back. All-zero and all-one bytes, so they are obviously not real and
      # obviously not the same key.
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      FIELD_ENCRYPTION_KEY_ID: enc-ci-1
      FIELD_HMAC_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      FIELD_HMAC_KEY_ID: hmac-ci-1
      # Inlined into the client bundle at build time: the donate page shows
      # its form. The money itself stays stubbed in the specs: in
      # production `next start` the mock adapter is refused, so CI raises
      # no inspectable charge.
      NEXT_PUBLIC_DONATIONS_ENABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Install Playwright's chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate the throwaway database
        run: npx prisma migrate deploy
      - name: Seed the e2e fixtures
        run: npx tsx tests/e2e/seed-e2e.ts
      - name: Build the bundle under test
        env:
          # A "dummy" URL makes src/lib/prisma.ts use its build-time mock,
          # as in build; the server under test gets the real URL instead.
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: npx next build
      - name: Drive the production bundle with Playwright
        run: npm run test:e2e
