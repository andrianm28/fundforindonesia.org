# Production compose: what the host runs (.scratch/ci-cd-github-actions,
# tickets 05, 07 and 08). docker-compose.yml stays the local/bootstrap file.
#
# The host never builds. The app and migrate images are built, scanned and
# pushed to GHCR by .github/workflows/cd.yml, and deployed by digest, so what
# runs is exactly what CI built and scanned, even if a tag is moved later. The
# deploy script, ops/deploy.sh (ticket 06), sets both digests, which cd.yml
# prints as outputs, and runs the equivalent of:
#
#   APP_DIGEST=sha256:... MIGRATE_DIGEST=sha256:... \
#     docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
#   APP_DIGEST=sha256:... MIGRATE_DIGEST=sha256:... \
#     docker compose -f docker-compose.prod.yml up -d app
#
# Every other value comes from the production .env next to this file. Unlike
# docker-compose.yml, secrets have no placeholder defaults here: a missing one
# stops the stack with a message instead of running production on
# "changeme123".
#
# Guarded by src/__tests__/docker-compose-prod.test.ts.

# A fixed project name, so the deploy script manages the same containers from
# whichever directory it runs. Not "fund-for-indonesia": that is the separate
# /opt/fund-for-indonesia stack. The data does not depend on this name; the
# volumes below are external.
name: fundforindonesia-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundindo
      # `:?` refuses the whole file when DB_PASSWORD is unset, which also
      # covers the DATABASE_URLs below.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: fund_indonesia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:18093:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundindo -d fund_indonesia"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/andrianm28/fundforindonesia.org@${APP_DIGEST:?set APP_DIGEST}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:3000"
    environment:
      DATABASE_URL: "postgresql://fundindo:${DB_PASSWORD}@db:5432/fund_indonesia?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Pre-launch switch, read by the server per request (not NEXT_PUBLIC_):
      # a restart applies it. Exact "true" shows Demo Campaigns in the catalogue.
      SHOW_DEMO_CAMPAIGNS: ${SHOW_DEMO_CAMPAIGNS:-false}
      # No default, for the reason given in docker-compose.yml: a default
      # webhook secret is a published one. Not required here (ticket 51): the
      # mock adapter is disabled under NODE_ENV=production unless
      # ALLOW_MOCK_PAYMENT_PROVIDER=true, so a production .env should carry
      # neither variable.
      MOCK_MIDTRANS_SERVER_KEY: ${MOCK_MIDTRANS_SERVER_KEY:-}
      ALLOW_MOCK_PAYMENT_PROVIDER: ${ALLOW_MOCK_PAYMENT_PROVIDER:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      # Empty means "no Sumopod", which fails closed (see docker-compose.yml).
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      SUMOPOD_WEBHOOK_SECRET: ${SUMOPOD_WEBHOOK_SECRET:-}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-}
      PAYMENT_LINK_ALLOWED_HOSTS: ${PAYMENT_LINK_ALLOWED_HOSTS:-}
      # Field-level encryption keys (ADR 0012). No defaults, for the reason
      # MOCK_MIDTRANS_SERVER_KEY above gives: a default key is a published one.
      # These are also no longer optional in practice -- the plaintext contact
      # columns are dropped, so a deployment without them cannot write a contact
      # detail at all and fails at the first one. See .env.example.
      # Public-endpoint rate limit (csr-06b). The secret keys the hash of the
      # caller's address and falls back to NEXTAUTH_SECRET; HOPS is how many
      # reverse proxies append to X-Forwarded-For (1 = nginx alone).
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      FIELD_ENCRYPTION_KEY_ID: ${FIELD_ENCRYPTION_KEY_ID:-}
      FIELD_HMAC_KEY: ${FIELD_HMAC_KEY:-}
      FIELD_HMAC_KEY_ID: ${FIELD_HMAC_KEY_ID:-}
      # Scheduled jobs trigger. Empty means the endpoint answers 503 to
      # everything, never an unauthenticated run (see .env.example).
      JOBS_SECRET: ${JOBS_SECRET:-}
      # Mailer. Unset in production, mail is logged as mail_not_configured and
      # not sent; the SMTP_PORT default matches the smtps relay in .env.example.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PARTNERSHIP_TEAM_EMAIL: ${PARTNERSHIP_TEAM_EMAIL:-}
      # NEXT_PUBLIC_DONATIONS_ENABLED and NEXT_PUBLIC_BASE_URL are deliberately
      # absent. Next inlines NEXT_PUBLIC_* into the server and client bundles at
      # build time, so a value here would be ignored while looking
      # authoritative. They are build args, set from the repository variables
      # in cd.yml; changing one means a new image.
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploads live in the volume, never in the image, or they would vanish on
      # every deploy. No bind mounts under public/ (see docker-compose.yml).
      - uploads:/app/public/uploads

  # One-off: `docker compose --profile migrate run --rm migrate`. Runs
  # `prisma migrate deploy` from the migrate target of the same Dockerfile and
  # commit as the app, and exits.
  migrate:
    image: ghcr.io/andrianm28/fundforindonesia.org@${MIGRATE_DIGEST:?set MIGRATE_DIGEST}
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://fundindo:${DB_PASSWORD}@db:5432/fund_indonesia?schema=public"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

# The existing production data, created by the kibi-clone compose project.
# External, under their exact names, so that `down -v` can never delete them
# and running this file from another directory can never create empty
# look-alikes. Not fund-for-indonesia_*: those belong to the separate
# /opt/fund-for-indonesia stack.
volumes:
  postgres_data:
    external: true
    name: kibi-clone_postgres_data
  uploads:
    external: true
    name: kibi-clone_uploads
