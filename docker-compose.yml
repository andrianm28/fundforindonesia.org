services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundindo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_DB: fund_indonesia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:18093:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundindo -d fund_indonesia"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:3000"
    environment:
      DATABASE_URL: "postgresql://fundindo:${DB_PASSWORD:-changeme123}@db:5432/fund_indonesia?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-please-change-this-secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Deliberately has no default. Every other variable here falls back to a
      # placeholder; this one must not, because a default webhook secret is a
      # published one, and the whole point of the signature is that only the
      # provider knows it. Unset means the container refuses to start, which
      # beats a running site that accepts forged payment notifications.
      MOCK_MIDTRANS_SERVER_KEY: ${MOCK_MIDTRANS_SERVER_KEY:?set MOCK_MIDTRANS_SERVER_KEY in .env}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      # Baked into the client bundle at build time, so changing it needs a
      # rebuild, not a restart. Defaults to off.
      NEXT_PUBLIC_DONATIONS_ENABLED: ${NEXT_PUBLIC_DONATIONS_ENABLED:-false}
      # These three do fall back to empty, unlike the key above, and that is
      # safe for the same reason the rule above exists: empty is not a
      # guessable default here, it is no provider at all. SumopodProvider
      # refuses to construct without them, so getPaymentProvider('sumopod')
      # raises PaymentProviderNotConfiguredError and the webhook route answers
      # 503. A deployment not using Sumopod boots; one that is misconfigured
      # rejects events rather than accepting unverifiable ones.
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      SUMOPOD_WEBHOOK_SECRET: ${SUMOPOD_WEBHOOK_SECRET:-}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads
      # No bind mount over public/images (or anything else under public/). The
      # image already carries public/ chowned to nextjs:nodejs (Dockerfile:
      # `RUN chown -R nextjs:nodejs public`). A host bind mount replaces that
      # copy with the checkout's own drwxrwx--- ubuntu:ubuntu directory, and
      # since Next scans public/ at startup, the unreadable directory crash-loops
      # the container with EACCES: scandir '/app/public/images'. The mount was
      # once a workaround for a build that could not run (next/font fetching
      # Inter from Google at build time); Inter is self-hosted now, so the
      # workaround only did harm. Production dropped it in kibi-clone 0045c62.
      # Guarded by src/__tests__/docker-compose.test.ts.

  # One-time migration runner
  migrate:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./prisma:/app/prisma
      - ./prisma.config.ts:/app/prisma.config.ts
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    environment:
      DATABASE_URL: "postgresql://fundindo:${DB_PASSWORD:-changeme123}@db:5432/fund_indonesia?schema=public"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: sh -c "npm install prisma@7.8.0 dotenv --save && npx prisma migrate deploy --schema=prisma/schema.prisma"
    profiles:
      - setup

  # Opt-in demo seed runner, for a fresh, empty database only. Behind the
  # `setup` profile, so plain `docker compose up` never starts it, and a normal
  # deploy never runs it; see `SEED=1` in deploy.sh.
  seed:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./prisma:/app/prisma
      - ./prisma.config.ts:/app/prisma.config.ts
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./src:/app/src
    environment:
      DATABASE_URL: "postgresql://fundindo:${DB_PASSWORD:-changeme123}@db:5432/fund_indonesia?schema=public"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: sh -c "npm install prisma@7.8.0 @prisma/client@7.8.0 tsx dotenv --save && npx prisma generate && npx tsx prisma/seed.ts"
    profiles:
      - setup

volumes:
  postgres_data:
  uploads:
